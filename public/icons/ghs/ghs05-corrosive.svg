<?xml version="1.0" encoding="UTF-8"?>
<!--
  GHS05 — Corrosion. Royalty-free pictogram per the UN GHS / CLP system.
  The "skin/material being corroded by liquid from a vessel" is the standard
  motif specified in UN ST/SG/AC.10/30 (Globally Harmonized System).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS05 — Corrosive">
  <title>GHS05 — Corrosive</title>
  <!-- Red diamond border on white -->
  <g transform="translate(50 50) rotate(45) translate(-50 -50)">
    <rect x="6" y="6" width="88" height="88" fill="#ffffff" stroke="#e30613" stroke-width="6" rx="4"/>
  </g>
  <!-- Inner symbol (upright, not rotated) -->
  <g fill="#000000" stroke="none">
    <!-- Test tube (left) tilted, dripping onto a hand -->
    <g transform="translate(22 30) rotate(-25)">
      <rect x="0" y="0" width="14" height="22" rx="1"/>
      <ellipse cx="7" cy="22" rx="7" ry="2"/>
      <!-- droplets -->
      <circle cx="7" cy="28" r="1.6"/>
      <circle cx="6" cy="33" r="1.4"/>
    </g>
    <!-- Hand being corroded (bottom-left) -->
    <path d="M18 60 L36 60 L36 70 Q36 74 32 74 L22 74 Q18 74 18 70 Z"/>
    <!-- pitting marks on hand -->
    <circle cx="24" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="29" cy="66" r="0.9" fill="#ffffff"/>
    <circle cx="32" cy="63" r="0.8" fill="#ffffff"/>
    <!-- Test tube (right) tilted, dripping onto a metal bar -->
    <g transform="translate(70 26) rotate(20)">
      <rect x="0" y="0" width="14" height="22" rx="1"/>
      <ellipse cx="7" cy="22" rx="7" ry="2"/>
      <circle cx="7" cy="28" r="1.6"/>
      <circle cx="8" cy="33" r="1.4"/>
    </g>
    <!-- Metal surface being corroded (bottom-right) -->
    <rect x="58" y="60" width="28" height="8"/>
    <!-- jagged corrosion pit eaten into the bar's top edge -->
    <path d="M62 60 L66 56 L70 58 L74 54 L78 60 Z" fill="#ffffff"/>
  </g>
</svg>
