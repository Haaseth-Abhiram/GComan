    <!--
      Fallback page title only. Every route sets its own via
      src/components/SEO.tsx — Helmet REPLACES the title element (unlike meta
      tags, which it appends), so this leaves no duplicate.
      Keep this string byte-identical to HOME_TITLE in
      scripts/verify-prerender-titles.mjs: that check finds prerender failures
      by spotting pages that shipped with this title still baked in. Delete the
      element and a failed route ships with no title at all, which the check
      cannot see — so removing it silently disables the guard.
    -->

      Per-page <title>, <meta name="description">, <meta name="keywords">,
      og:*, twitter:*, hreflang, canonical, robots are set by react-helmet-async
      via src/components/SEO.tsx during prerender. Do NOT hardcode them here —
      Helmet APPENDS new <meta>/<link> tags rather than replacing existing ones,
      so any tag below leaves a homepage-default duplicate on every prerendered
      page and Google reads the first (homepage) value.
    -->
