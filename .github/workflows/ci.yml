# Quality gate for the Lovable auto-deploy chain (push to main → Lovable
# builds dist/ → FTP to Hostinger). Nothing else checks types, lint, or the
# e2e smoke suite before code reaches production, so this workflow must stay
# green on Develop before promoting to main.
name: CI

on:
  push:
    branches: [Develop, main]
  pull_request:
    branches: [Develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build (dev mode, no prerender)
        run: npm run build:dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e (smoke)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
