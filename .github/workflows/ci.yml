# Quality gate for the Lovable auto-deploy chain (push to main → Lovable runs
# vite build → publishes dist/ to Lovable's CDN, which serves production).
# Nothing else checks types, lint, or the e2e smoke suite before code reaches
# production, so this workflow must stay green on Develop before promoting to
# main. See CLAUDE.md "Deploy chain" — the old "FTP to Hostinger" story is
# retired; that server's public_html is empty and serves nothing.
name: CI

on:
  push:
    branches: [Develop, main]
  pull_request:
    branches: [Develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      # Fails if public/sitemap.xml drifts from what <SEO> actually renders —
      # i.e. if it submits a noindex URL or one that canonicalises elsewhere.
      # Fix with: node scripts/sync-ar-sitemap.mjs
      - name: Sitemap health
        run: npm run verify:sitemap-health
      # Fails if the eager Arabic SEO-meta subset drifts from the full
      # translation files. Fix with: node scripts/sync-ar-meta.mjs
      - name: Arabic meta subset
        run: npm run verify:ar-meta
      # Fails if any product's rendered <title> exceeds the 60-char SERP clamp,
      # duplicates another product's, or gets truncated past the word "Oman".
      # Catches the 2026-09-27 class of regression, where retitling pushed 20
      # composed titles over the clamp and silently dropped the geo signal —
      # invisible to tsc/lint/build/e2e. Fix by adding a details.seoTitle.
      - name: Product SERP titles
        run: npm run verify:serp-titles
      - name: Build (dev mode, no prerender)
        run: npm run build:dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e (smoke)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
